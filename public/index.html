<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskflow — мои задачи</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body><aside><a class="brand" href="/">◈ Taskflow</a><p class="aside-label">ЛИЧНОЕ ПРОСТРАНСТВО</p><div class="nav-active">▦ &nbsp; Мои задачи</div><div class="aside-note">Меньше хаоса.<br>Больше сделанного.</div></aside>
<main><header><span>Рабочее пространство / Задачи</span><span class="avatar">Я</span></header><section class="heading"><div><p class="eyebrow">ШАГ ЗА ШАГОМ</p><h1>Мои задачи<span>.</span></h1><p>Всё важное — в одном месте.</p></div><button id="new-task" class="primary">＋ Новая задача</button></section>
<section class="stats" aria-label="Статистика"><article><span>Всего задач</span><strong id="total">—</strong></article><article><span>В работе</span><strong id="doing">—</strong></article><article><span>Завершено</span><strong id="done">—</strong></article></section>
<section class="toolbar"><div id="filters" role="group" aria-label="Статус"><button data-status="" class="selected" aria-pressed="true">Все задачи</button><button data-status="todo" aria-pressed="false">В планах</button><button data-status="doing" aria-pressed="false">В работе</button><button data-status="done" aria-pressed="false">Готово</button></div><input id="search" type="search" aria-label="Поиск задач" placeholder="Поиск задач…" maxlength="160"></section>
<p id="message" role="status" aria-live="polite"></p><section id="tasks" class="task-grid" aria-label="Задачи"></section><div id="empty" hidden><h2>Здесь пока пусто</h2><p>Создай задачу или измени условия поиска.</p></div></main>
<dialog id="editor"><form id="task-form"><div class="modal-top"><h2 id="modal-title">Новая задача</h2><button type="button" id="close" aria-label="Закрыть">×</button></div><label>Название<input name="title" required maxlength="160" placeholder="Что нужно сделать?"></label><label>Описание<textarea name="description" maxlength="4000" rows="4" placeholder="Детали, ссылки, заметки"></textarea></label><div class="form-row"><label>Статус<select name="status"><option value="todo">В планах</option><option value="doing">В работе</option><option value="done">Готово</option></select></label><label>Приоритет<select name="priority"><option value="low">Низкий</option><option value="medium" selected>Средний</option><option value="high">Высокий</option></select></label></div><label>Срок<input type="date" name="due_date" min="0001-01-01" max="9999-12-31"></label><p id="form-error" role="alert"></p><div class="modal-actions"><button type="button" id="cancel">Отмена</button><button id="save" class="primary">Сохранить задачу</button></div></form></dialog>
</body></html>
